name: Bug report
description: Report a wrong finding, a missed finding, or a crash
labels: ["bug"]
body:
  - type: input
    id: phptramp-version
    attributes:
      label: phptramp version
      description: Output of `composer show phptramp/phptramp` (or the git ref).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.23"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal reproducing PHP code
      description: The smallest self-contained PHP snippet that triggers the behavior.
      render: php
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command
      placeholder: "vendor/bin/phptramp --folder src --limit 3"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What you expected phptramp to report, and why.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Full output, including stderr. Use `--explain` if call resolution looks wrong.
    validations:
      required: true
