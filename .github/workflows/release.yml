# Publishes a GitHub Release when a plain vX.Y.Z tag is pushed on main, and
# writes the generated release notes into CHANGELOG.md.
#
# A tag push proves nothing on its own: it can name any commit, and CI does not
# run on tags. Two guard steps supply what the trigger cannot -- the commit is
# on main, and CI went green on that exact SHA -- before anything is published
# or committed back.
#
# A push event on a tag runs THIS FILE AS IT EXISTS AT THAT TAG.
name: Release

on:
  push:
    # GitHub filter patterns, not regex: '.' is literal and '+' means "one or
    # more of the preceding character". This matches vX.Y.Z and nothing else.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

# Create the release, and push the changelog commit back to the branches.
permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'larspohlmann/phptramp'

    steps:
      # fetch-depth: 0 populates origin/main (guard 1) and all tags (previous-tag
      # lookup). Credentials are persisted on purpose: the changelog step pushes
      # back to main and develop.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GUARD 1 of 2: the tagged commit must be on main.
      - name: Check the tagged commit is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "!!! origin/main is not in this checkout; fix fetch-depth, do not drop the check." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "!!! ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Refusing to release." >&2
            echo "!!!   git tag -d ${GITHUB_REF_NAME} && git push origin :${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "==> ${GITHUB_SHA} is on main"

      # GUARD 2 of 2: CI must be green for this commit. Absence is failure.
      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusions="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '.workflow_runs[] | select(.event == "push") | .conclusion')"
          if [ -z "${conclusions}" ]; then
            echo "!!! no completed CI run found for ${GITHUB_SHA}. Refusing to release." >&2
            exit 1
          fi
          failed=0
          while IFS= read -r conclusion; do
            echo "    ${conclusion}"
            [ "${conclusion}" = "success" ] || failed=1
          done <<< "${conclusions}"
          [ "${failed}" -eq 0 ] || { echo "!!! CI is not green for ${GITHUB_SHA}." >&2; exit 1; }
          echo "==> CI is green for ${GITHUB_SHA}"

      # The previous release is the highest plain-semver tag below this one.
      # Empty means this is the first release.
      - name: Determine the previous release
        id: previous
        run: |
          set -euo pipefail
          # The || true makes the first release possible: with no earlier tag the
          # grep matches nothing and exits 1, which pipefail would otherwise abort.
          previous="$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vFx "${GITHUB_REF_NAME}" \
            | sort -V | tail -n 1 || true)"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"
          if [ -n "${previous}" ]; then
            echo "==> previous release: ${previous}"
          else
            echo "==> no previous release; this is the first"
          fi

      # First release: a plain body. Later releases: notes generated from the PRs
      # merged since the previous tag.
      - name: Build the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous='${{ steps.previous.outputs.previous }}'
          if [ -z "${previous}" ]; then
            printf 'Initial release.\n' > "${RUNNER_TEMP}/notes.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f previous_tag_name="${previous}" \
              --jq .body > "${RUNNER_TEMP}/notes.md"
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            --verify-tag

      # Insert the notes as a new version section under "## [Unreleased]" and push
      # to main. Runs for the first release too, so CHANGELOG.md always has a
      # section per tag.
      - name: Update CHANGELOG.md on main
        run: |
          set -euo pipefail
          git checkout main
          git merge --ff-only "${GITHUB_SHA}"

          released_on="$(date -u +%Y-%m-%d)"
          updated="$(mktemp)"
          awk -v tag="${GITHUB_REF_NAME}" -v day="${released_on}" -v notes="${RUNNER_TEMP}/notes.md" '
            { print }
            /^## \[Unreleased\]/ && !inserted {
              print ""
              print "## [" tag "] - " day
              print ""
              while ((getline line < notes) > 0) { print line }
              inserted = 1
            }
          ' CHANGELOG.md > "${updated}"
          mv "${updated}" CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "==> CHANGELOG.md unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs: changelog for ${GITHUB_REF_NAME} [skip ci]"
          git push origin main

      # Carry that same commit onto develop so main never ends a release one
      # commit ahead of develop (git-flow keeps the two in lockstep).
      #
      # A real merge, deliberately: an equivalent cherry-pick would give develop
      # a different SHA, so main would not be an ancestor of develop and the next
      # release's `git merge --ff-only` would refuse. Same content is not same
      # history.
      - name: Carry the changelog commit onto develop
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          git checkout -B develop-sync origin/develop
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Fast-forward when develop has not moved since the release commit -- the
          # normal case. A real merge otherwise; a CHANGELOG conflict there is
          # genuine (develop added Unreleased entries after the tag). Surface it.
          if ! git merge --no-edit main; then
            echo "!!! could not merge main into develop. The release IS already published;" >&2
            echo "!!! only this sync failed. Recover by hand:" >&2
            echo "!!!   git checkout develop && git merge main && git push origin develop" >&2
            exit 1
          fi
          git push origin HEAD:develop
          echo "==> develop now contains the ${GITHUB_REF_NAME} changelog commit"
